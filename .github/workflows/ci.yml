name: Track Thing CI

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build
        working-directory: frontend

      - name: Test Frontend
        run: pnpm test --watch=false
        working-directory: frontend

      - name: Build Backend
        run: pnpm build
        working-directory: backend

      - name: Test Backend
        run: pnpm test:e2e
        working-directory: backend
