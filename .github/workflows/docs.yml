name: Build Typst PDF

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Build PDF
        run: typst compile docs/weblab-documentation.typ weblab-documentation.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: weblab-documentation
          path: weblab-documentation.pdf
